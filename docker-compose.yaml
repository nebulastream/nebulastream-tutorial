services:

  nes:
    image: nebulastream/worker:main
    volumes:
      - ./output:/output
    command: ["--grpc=nes:8080"]

  datagen:
    build:
      context: docker/datagen
    ports:
      - 5002:5002
    command: ["bash", "-c", "python3 datagen.py"]

  nebuli:
    image: nebulastream/nebuli:main
    depends_on:
      - nes
      - datagen
    volumes:
      - ./queries:/queries
    entrypoint: ["bash", "-c", "sleep 5 && nes-nebuli -s nes:8080 register -x -i queries/s2s.yaml"]
