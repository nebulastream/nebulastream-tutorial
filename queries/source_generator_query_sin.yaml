query: |
  SELECT ID, FIELD2
  FROM Generator(
       'ALL' as `SOURCE`.STOP_GENERATOR_WHEN_SEQUENCE_FINISHES,
       1 AS `SOURCE`.SEED,
       'SINUS' AS `SOURCE`.GENERATOR_RATE_TYPE,
       'amplitude 10, frequency 1' AS `SOURCE`.GENERATOR_RATE_CONFIG,
       'CSV' AS PARSER.`TYPE`,
       'SEQUENCE UINT64 0 10000 1, SEQUENCE UINT64 0 100 1' AS `SOURCE`.GENERATOR_SCHEMA,
       SCHEMA(id UINT64, field2 UINT64) AS `SOURCE`.`SCHEMA`)
  INTO File('CSV' AS `SINK`.INPUT_FORMAT, "/output/sink.csv" AS `SINK`.FILE_PATH)

sinks: []
